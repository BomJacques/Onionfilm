<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onion Skin Camera</title>
<style>
  /* Layout: full-height column. Viewfinder takes all spare space, control panel sits at the bottom.
     Project settings, video export and file actions live in a bottom sheet. */
  :root {
    color-scheme: dark;
    --bg: #101214;
    --panel: #1a1d21;
    --line: #2c3138;
    --text: #e9ecef;
    --muted: #98a1ab;
    --accent: #ffb020;
    --danger: #ff6b5e;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font: 15px/1.35 var(--sans);
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: default; }
  [hidden] { display: none !important; }

  .stage { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden;
    padding-top: env(safe-area-inset-top); }
  .stage video, .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #ghost { pointer-events: none; }
  #ghost.diff { mix-blend-mode: difference; }
  #player { background: #000; }
  .badge { position: absolute; left: 12px; top: calc(12px + env(safe-area-inset-top)); padding: 4px 10px;
    border-radius: 999px; background: rgba(0,0,0,.6); font-size: 13px; font-variant-numeric: tabular-nums; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.on { animation: flash .25s ease-out; }
  @keyframes flash { from { opacity: .7; } to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .flash.on { animation: none; } }

  .msg { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; padding: 24px; text-align: center; background: rgba(0,0,0,.72); }
  .msg p { margin: 0; max-width: 34ch; }
  .primary { background: var(--accent); color: #1a1200; border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 600; }

  .panel { background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); }
  .row { display: flex; align-items: center; gap: 12px; }

  .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex: none; }
  .seg button { background: none; border: 0; padding: 8px 11px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #1a1200; font-weight: 600; }
  input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }
  .val { width: 6ch; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }

  .pinbar { font-size: 13px; color: var(--muted); flex-wrap: wrap; gap: 8px; }
  .pinbar span { flex: 1; min-width: 12ch; }
  .small { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .danger { color: var(--danger); }

  .strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; min-height: 58px; align-items: center; }
  .strip .empty { color: var(--muted); font-size: 13px; }
  .thumb { position: relative; flex: none; width: 72px; height: 54px; padding: 0; border: 2px solid transparent;
    border-radius: 7px; overflow: hidden; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb i { position: absolute; left: 3px; bottom: 2px; font-style: normal; font-size: 11px;
    background: rgba(0,0,0,.65); padding: 0 4px; border-radius: 4px; font-variant-numeric: tabular-nums; }
  .thumb.ref { border-color: var(--accent); }

  .actions { display: grid; grid-template-columns: 1fr 1fr auto 1fr 1fr; align-items: center; gap: 8px; }
  .actions .small { padding: 10px 4px; font-size: 13px; white-space: nowrap; }
  #shutter { width: 68px; height: 68px; border-radius: 50%; border: 4px solid var(--text); background: none; padding: 4px; margin: 0 6px; }
  #shutter::before { content: ""; display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--accent); }
  #shutter:active::before { transform: scale(.9); }

  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet-in { background: var(--panel); width: 100%; max-width: 520px; max-height: 92%; overflow-y: auto;
    border-radius: 16px 16px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px; }
  .sheet h2 { margin: 0; font-size: 18px; flex: 1; }
  .sheet h3 { margin: 8px 0 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .sheet label { color: var(--muted); font-size: 13px; flex: none; width: 9ch; }
  #projName { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
    -webkit-user-select: text; user-select: text; font-size: 16px; }
  .note { color: var(--muted); font-size: 13px; margin: 0; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btns .small { padding: 11px 8px; }
  .btns .primary { padding: 11px 8px; }

  @media (orientation: landscape) and (max-height: 520px) {
    body { flex-direction: row; }
    .panel { width: 300px; border-top: 0; border-left: 1px solid var(--line); justify-content: center;
      padding: 10px calc(12px + env(safe-area-inset-right)) 10px 12px; }
  }
</style>
</head>
<body>
  <div class="stage">
    <video id="video" playsinline muted autoplay></video>
    <img id="ghost" alt="" hidden>
    <img id="player" alt="" hidden>
    <div class="flash" id="flash"></div>
    <div class="badge" id="badge">0 frames</div>
    <div class="msg" id="msg">
      <p id="msgText">Line up each new photo against a see-through copy of the last one.</p>
      <button class="primary" id="start">Start camera</button>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <div class="seg" role="group" aria-label="Overlay mode">
        <button id="modeFade" aria-pressed="true">Fade</button>
        <button id="modeDiff" aria-pressed="false">Difference</button>
        <button id="modeOff" aria-pressed="false">Off</button>
      </div>
      <input type="range" id="opacity" min="0" max="100" value="50" aria-label="Overlay opacity">
      <span class="val" id="opacityVal" style="width:4ch">50%</span>
    </div>

    <div class="row pinbar" id="pinbar" hidden>
      <span id="pinText"></span>
      <button class="small" id="saveOne">Save</button>
      <button class="small danger" id="delOne">Delete</button>
      <button class="small" id="unpin">Use latest</button>
    </div>

    <div class="strip" id="strip"></div>

    <div class="actions">
      <button class="small" id="importBtn">Add photo</button>
      <button class="small" id="flip">Flip</button>
      <button id="shutter" aria-label="Take photo" disabled></button>
      <button class="small" id="play" disabled>Play</button>
      <button class="small" id="projBtn">Project</button>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <input type="file" id="zipFile" accept=".zip,application/zip" hidden>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-in" role="dialog" aria-labelledby="sheetTitle">
      <div class="row"><h2 id="sheetTitle">Project</h2><button class="small" id="closeSheet">Done</button></div>
      <div class="row"><label for="projName">Name</label><input id="projName" type="text" maxlength="40" autocomplete="off" placeholder="My film"></div>
      <p class="note" id="projInfo"></p>

      <h3>Video</h3>
      <div class="row"><label for="fps">Speed</label><input type="range" id="fps" min="1" max="30" value="12"><span class="val" id="fpsVal">12 fps</span></div>
      <div class="row"><label for="hold">Hold last</label><input type="range" id="hold" min="0" max="5" step="0.5" value="1"><span class="val" id="holdVal">1 s</span></div>
      <p class="note" id="vidInfo"></p>
      <div class="btns">
        <button class="primary" id="exportVid">Make video</button>
        <button class="small" id="saveVid" disabled>Save video</button>
      </div>

      <h3>Files</h3>
      <div class="btns">
        <button class="small" id="savePhotos">Save photos</button>
        <button class="small" id="saveProj">Save project file</button>
        <button class="small" id="openProj">Open project file</button>
        <button class="small danger" id="newProj">New project</button>
      </div>
      <p class="note" id="fileInfo">The project file is a zip of every photo in order. Opening one or starting a new project replaces the photos here.</p>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), ghost = $('ghost'), player = $('player');
let stream = null, facing = 'environment';
let frames = [];          // {id, blob, url} in shooting order
let pinned = null;        // id of the frame to align to; null = latest
let mode = 'fade';
let db = null, localId = 0;
let playTimer = null, videoBlob = null, rendering = false;

/* ---------- small settings (name, speed) ---------- */
function getSet(k, d) { try { const v = localStorage.getItem('osc.' + k); return v === null ? d : v; } catch (e) { return d; } }
function putSet(k, v) { try { localStorage.setItem('osc.' + k, v); } catch (e) {} }
function safeName() {
  return ($('projName').value.trim().replace(/[^\w\- ]+/g, '').replace(/\s+/g, '-')) || 'onion-skin';
}

/* ---------- storage (the project survives a reload on this device) ---------- */
function openDb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('onion-skin-camera', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('frames', { autoIncrement: true });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function dbReq(modeName, fn) {
  return new Promise((res, rej) => {
    if (!db) return rej(new Error('no db'));
    const tx = db.transaction('frames', modeName);
    const r = fn(tx.objectStore('frames'));
    tx.oncomplete = () => res(r && r.result);
    tx.onerror = tx.onabort = () => rej(tx.error);
  });
}
async function loadSaved() {
  try {
    db = await openDb();
    await new Promise((res, rej) => {
      const c = db.transaction('frames').objectStore('frames').openCursor();
      c.onsuccess = () => {
        const cur = c.result;
        if (!cur) return res();
        frames.push({ id: cur.key, blob: cur.value, url: URL.createObjectURL(cur.value) });
        cur.continue();
      };
      c.onerror = () => rej(c.error);
    });
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) { db = null; }
  render();
}
async function addFrame(blob, quiet) {
  let id;
  try { id = await dbReq('readwrite', s => s.add(blob)); }
  catch (e) { id = 'm' + (++localId); }
  frames.push({ id, blob, url: URL.createObjectURL(blob) });
  if (!quiet) render(true);
}
async function removeFrame(id) {
  const i = frames.findIndex(f => f.id === id);
  if (i < 0) return;
  URL.revokeObjectURL(frames[i].url);
  frames.splice(i, 1);
  if (pinned === id) pinned = null;
  try { await dbReq('readwrite', s => s.delete(id)); } catch (e) {}
  render();
}
async function clearAll() {
  stopPlay();
  frames.forEach(f => URL.revokeObjectURL(f.url));
  frames = []; pinned = null; videoBlob = null;
  try { await dbReq('readwrite', s => s.clear()); } catch (e) {}
  render();
}

/* ---------- camera ---------- */
function showMsg(text, btn) {
  $('msgText').textContent = text;
  $('start').textContent = btn || 'Start camera';
  $('msg').hidden = false;
}
async function startCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showMsg('This browser will not give the page a camera here. Open the page over https or from localhost.', 'Try again');
    return;
  }
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    // Ask for the largest video frame the camera offers (up to 4K); the browser picks the closest it supports.
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: facing }, width: { ideal: 3840 }, height: { ideal: 2160 } }
    });
    video.srcObject = stream;
    await video.play();
    $('msg').hidden = true;
    $('shutter').disabled = false;
    render();
  } catch (e) {
    $('shutter').disabled = true;
    const why = e.name === 'NotAllowedError' ? 'Camera access was blocked. Allow the camera for this page in your browser settings, then try again.'
      : e.name === 'NotFoundError' || e.name === 'OverconstrainedError' ? 'No camera was found on this device.'
      : e.name === 'NotReadableError' ? 'Another app is using the camera. Close it, then try again.'
      : 'The camera could not start (' + (e.message || e.name) + ').';
    showMsg(why, 'Try again');
  }
}
video.addEventListener('resize', () => render());
function capture() {
  if (!video.videoWidth) return;
  stopPlay();
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  c.toBlob(b => { if (b) addFrame(b); }, 'image/jpeg', 0.95);
  const fl = $('flash'); fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
}

/* ---------- view ---------- */
function refFrame() {
  return (pinned !== null && frames.find(f => f.id === pinned)) || frames[frames.length - 1] || null;
}
function applyOverlay() {
  const ref = refFrame();
  ghost.hidden = !ref || mode === 'off';
  if (ref && ghost.src !== ref.url) ghost.src = ref.url;
  ghost.classList.toggle('diff', mode === 'diff');
  ghost.style.opacity = $('opacity').value / 100;
  $('opacityVal').textContent = $('opacity').value + '%';
  for (const [id, m] of [['modeFade', 'fade'], ['modeDiff', 'diff'], ['modeOff', 'off']])
    $(id).setAttribute('aria-pressed', String(mode === m));
}
function updateInfo() {
  const n = frames.length, fps = +$('fps').value, hold = +$('hold').value;
  const cam = video.videoWidth ? video.videoWidth + ' × ' + video.videoHeight : '';
  $('badge').textContent = n + (n === 1 ? ' frame' : ' frames') + (cam ? ' · ' + cam : '');
  $('projInfo').textContent = n + (n === 1 ? ' photo' : ' photos') + ' in this project' + (cam ? '. Camera is shooting at ' + cam + ' pixels.' : '.');
  $('fpsVal').textContent = fps + ' fps';
  $('holdVal').textContent = hold + ' s';
  if (!rendering) {
    $('vidInfo').textContent = n ? 'The video will run ' + (n / fps + hold).toFixed(1) + ' seconds, and takes that long to make.'
                                 : 'Take some photos first.';
    $('exportVid').disabled = !n;
  }
  $('saveVid').disabled = !videoBlob;
  $('savePhotos').disabled = $('saveProj').disabled = $('newProj').disabled = !n;
  $('play').disabled = !n;
}
function render(scrollEnd) {
  const strip = $('strip'), ref = refFrame();
  strip.textContent = '';
  if (!frames.length) {
    const s = document.createElement('span');
    s.className = 'empty';
    s.textContent = 'No photos yet. Take one, or add an earlier photo to align to.';
    strip.append(s);
  }
  frames.forEach((f, i) => {
    const b = document.createElement('button');
    b.className = 'thumb' + (ref && ref.id === f.id ? ' ref' : '');
    b.setAttribute('aria-label', 'Align to frame ' + (i + 1));
    const im = document.createElement('img'); im.src = f.url; im.alt = ''; im.loading = 'lazy';
    const n = document.createElement('i'); n.textContent = i + 1;
    b.append(im, n);
    b.onclick = () => { pinned = pinned === f.id ? null : f.id; resetConfirms(); render(); };
    strip.append(b);
  });
  if (scrollEnd) strip.scrollLeft = strip.scrollWidth;
  const pin = pinned !== null && frames.find(f => f.id === pinned);
  $('pinbar').hidden = !pin;
  if (pin) $('pinText').textContent = 'Aligning to frame ' + (frames.indexOf(pin) + 1) + ' of ' + frames.length;
  applyOverlay();
  updateInfo();
}

/* ---------- playback preview ---------- */
function stopPlay() {
  if (!playTimer) return;
  clearInterval(playTimer); playTimer = null;
  player.hidden = true; $('play').textContent = 'Play';
}
function togglePlay() {
  if (playTimer) return stopPlay();
  if (!frames.length) return;
  let i = 0;
  player.src = frames[0].url; player.hidden = false; $('play').textContent = 'Stop';
  playTimer = setInterval(() => { i = (i + 1) % frames.length; player.src = frames[i].url; }, 1000 / +$('fps').value);
}

/* ---------- saving ---------- */
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}
function frameName(i, f) {
  const ext = f.blob.type === 'image/png' ? 'png' : f.blob.type === 'image/webp' ? 'webp' : 'jpg';
  return safeName() + '_' + String(i + 1).padStart(4, '0') + '.' + ext;
}
function namedFrames() { return frames.map((f, i) => ({ name: frameName(i, f), blob: f.blob })); }
async function shareFiles(list) {       // phone share sheet: "Save Image", "Save Video" or "Save to Files"
  if (!navigator.canShare) return false;
  const files = list.map(x => new File([x.blob], x.name, { type: x.blob.type || 'image/jpeg' }));
  if (!navigator.canShare({ files })) return false;
  try { await navigator.share({ files }); }
  catch (e) { if (e.name !== 'AbortError') return false; }
  return true;
}
async function saveOut(list) {           // share sheet where there is one, plain download otherwise
  if (!list.length) return;
  if (await shareFiles(list)) return;
  if (list.length === 1) return download(list[0].blob, list[0].name);
  download(await makeZip(list), safeName() + '.zip');
}

const CRC = (() => { const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function makeZip(files) {           // files: [{name, blob}]; stored uncompressed (JPEGs do not shrink)
  const d = new Date(), enc = new TextEncoder();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const parts = [], central = []; let offset = 0;
  for (const f of files) {
    const data = new Uint8Array(await f.blob.arrayBuffer()), name = enc.encode(f.name), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(10, time, true); lh.setUint16(12, date, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
    parts.push(lh, name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(12, time, true); ch.setUint16(14, date, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(ch, name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((n, p) => n + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type: 'application/zip' });
}
async function readZip(file) {            // returns the images inside, sorted by file name
  const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer), dec = new TextDecoder();
  let e = buf.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('That is not a zip file.');
  const n = dv.getUint16(e + 10, true), out = [];
  let p = dv.getUint32(e + 16, true);
  const types = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp' };
  for (let i = 0; i < n && dv.getUint32(p, true) === 0x02014b50; i++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = dec.decode(buf.subarray(p + 46, p + 46 + nl));
    p += 46 + nl + el + cl;
    const m = /\.(jpe?g|png|webp)$/i.exec(name);
    if (!m || name.startsWith('__MACOSX') || name.split('/').pop().startsWith('.')) continue;
    const type = types[m[1].toLowerCase()];
    const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
    const data = buf.slice(start, start + csize);
    if (method === 0) out.push({ name, blob: new Blob([data], { type }) });
    else if (method === 8 && window.DecompressionStream) {
      const raw = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
      out.push({ name, blob: new Blob([raw], { type }) });
    }
  }
  out.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  return out;
}
async function saveProject() {
  const b = $('saveProj'); b.disabled = true; b.textContent = 'Packing';
  try {
    const zip = await makeZip(namedFrames()), name = safeName() + '.zip';
    if (!(await shareFiles([{ blob: zip, name }]))) download(zip, name);
  } finally { b.textContent = 'Save project file'; updateInfo(); }
}
async function openProject(file) {
  const info = $('fileInfo');
  try {
    const list = await readZip(file);
    if (!list.length) { info.textContent = 'No photos were found in that file, so nothing was changed.'; return; }
    await clearAll();
    for (const x of list) await addFrame(x.blob, true);
    $('projName').value = file.name.replace(/\.zip$/i, ''); putSet('name', $('projName').value);
    info.textContent = 'Opened ' + list.length + ' photos from ' + file.name + '.';
    render(true);
  } catch (e) { info.textContent = 'Could not open that file. ' + (e.message || ''); }
}

/* ---------- video export ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const loadImg = url => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('A photo could not be read.')); im.src = url; });
async function makeVideo() {
  if (rendering || !frames.length) return;
  const info = $('vidInfo');
  const type = window.MediaRecorder && ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  if (!type || !HTMLCanvasElement.prototype.captureStream) { info.textContent = 'This browser cannot record video. Save the project file and build the video on a computer instead.'; return; }
  stopPlay(); rendering = true; videoBlob = null;
  $('exportVid').disabled = true; $('saveVid').disabled = true;
  const fps = +$('fps').value, hold = +$('hold').value, list = frames.slice();
  let tick = null;
  try {
    let img = await loadImg(list[0].url);
    const scale = Math.min(1, 1920 / Math.max(img.naturalWidth, img.naturalHeight));   // cap at 1080p-class for the encoder
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * scale / 2) * 2; c.height = Math.round(img.naturalHeight * scale / 2) * 2;
    const g = c.getContext('2d');
    const draw = () => {
      g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
      const s = Math.min(c.width / img.naturalWidth, c.height / img.naturalHeight), w = img.naturalWidth * s, h = img.naturalHeight * s;
      g.drawImage(img, (c.width - w) / 2, (c.height - h) / 2, w, h);
    };
    draw();
    const rec = new MediaRecorder(c.captureStream(30), { mimeType: type, videoBitsPerSecond: 12000000 });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    const done = new Promise((res, rej) => { rec.onstop = res; rec.onerror = e => rej(e.error || new Error('Recording failed.')); });
    rec.start();
    tick = setInterval(draw, 1000 / 30);       // keep feeding the recorder while a frame is held
    for (let i = 0; i < list.length; i++) {
      info.textContent = 'Making video: photo ' + (i + 1) + ' of ' + list.length + '. Keep this page open.';
      const next = i + 1 < list.length ? loadImg(list[i + 1].url) : null;
      await sleep(1000 / fps + (i === list.length - 1 ? hold * 1000 : 0));
      if (next) img = await next;
    }
    clearInterval(tick); tick = null;
    rec.stop(); await done;
    videoBlob = new Blob(chunks, { type: type.split(';')[0] });
    info.textContent = 'Video ready (' + (videoBlob.size / 1048576).toFixed(1) + ' MB). Tap Save video.';
  } catch (e) {
    info.textContent = 'The video could not be made. ' + (e.message || '');
  } finally {
    if (tick) clearInterval(tick);
    rendering = false; $('exportVid').disabled = !frames.length; $('saveVid').disabled = !videoBlob;
  }
}
function saveVideo() {
  if (!videoBlob) return;
  saveOut([{ blob: videoBlob, name: safeName() + (videoBlob.type === 'video/mp4' ? '.mp4' : '.webm') }]);
}

/* ---------- controls ---------- */
const confirms = [['delOne', 'Delete'], ['newProj', 'New project'], ['openProj', 'Open project file']];
let confirmTimer = null;
function resetConfirms() { clearTimeout(confirmTimer); confirms.forEach(([id, label]) => { $(id).textContent = label; delete $(id).dataset.armed; }); }
function twoTap(id, fn, needed) {         // first tap arms, second tap within 3 s runs
  $(id).onclick = () => {
    const b = $(id);
    if (b.dataset.armed || (needed && !needed())) { resetConfirms(); fn(); return; }
    resetConfirms(); b.dataset.armed = '1'; b.textContent = 'Tap again';
    confirmTimer = setTimeout(resetConfirms, 3000);
  };
}
$('start').onclick = startCam;
$('shutter').onclick = capture;
$('flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCam(); };
$('modeFade').onclick = () => { mode = 'fade'; applyOverlay(); };
$('modeDiff').onclick = () => { mode = 'diff'; applyOverlay(); };
$('modeOff').onclick = () => { mode = 'off'; applyOverlay(); };
$('opacity').oninput = applyOverlay;
$('unpin').onclick = () => { pinned = null; render(); };
$('saveOne').onclick = () => { const i = frames.findIndex(f => f.id === pinned); if (i >= 0) saveOut([{ name: frameName(i, frames[i]), blob: frames[i].blob }]); };
twoTap('delOne', () => removeFrame(pinned));
$('play').onclick = togglePlay;
player.onclick = stopPlay;
$('importBtn').onclick = () => $('file').click();
$('file').onchange = async e => { for (const f of e.target.files) if (f.type.startsWith('image/')) await addFrame(f); e.target.value = ''; };

$('projBtn').onclick = () => { stopPlay(); updateInfo(); $('sheet').hidden = false; };
$('closeSheet').onclick = () => { resetConfirms(); $('sheet').hidden = true; };
$('sheet').onclick = e => { if (e.target === $('sheet')) $('closeSheet').onclick(); };
$('projName').value = getSet('name', '');
$('projName').oninput = () => putSet('name', $('projName').value);
$('fps').value = getSet('fps', '12'); $('hold').value = getSet('hold', '1');
$('fps').oninput = () => { putSet('fps', $('fps').value); updateInfo(); };
$('hold').oninput = () => { putSet('hold', $('hold').value); updateInfo(); };
$('exportVid').onclick = makeVideo;
$('saveVid').onclick = saveVideo;
$('savePhotos').onclick = () => saveOut(namedFrames());
$('saveProj').onclick = saveProject;
twoTap('openProj', () => $('zipFile').click(), () => frames.length > 0);   // only asks twice when photos would be replaced
$('zipFile').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (f) await openProject(f); };
twoTap('newProj', async () => { await clearAll(); $('projName').value = ''; putSet('name', ''); $('fileInfo').textContent = 'Started a new, empty project.'; });

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !$('shutter').disabled && $('sheet').hidden && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') { e.preventDefault(); capture(); }
});
document.addEventListener('visibilitychange', () => {   // phones drop the camera when the page is backgrounded
  if (!document.hidden && stream && stream.getTracks().every(t => t.readyState === 'ended')) startCam();
});

loadSaved();
</script>
</body>
</html>

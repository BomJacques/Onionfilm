<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23272d"/>
      <stop offset="1" stop-color="#0e1012"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- three earlier "frames", each offset and fainter, like onion skin layers -->
  <circle cx="372" cy="372" r="250" fill="none" stroke="#ffb020" stroke-opacity=".22" stroke-width="40"/>
  <circle cx="452" cy="452" r="250" fill="none" stroke="#ffb020" stroke-opacity=".45" stroke-width="40"/>
  <circle cx="532" cy="532" r="250" fill="none" stroke="#ffb020" stroke-opacity=".7" stroke-width="40"/>
  <!-- current frame -->
  <circle cx="612" cy="612" r="250" fill="none" stroke="#ffb020" stroke-width="40"/>
  <circle cx="612" cy="612" r="92" fill="#ffb020"/>
</svg>
